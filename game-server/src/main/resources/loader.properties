# Default PropertiesLauncher config (see game-server/pom.xml's spring-boot-maven-plugin ZIP
# layout) - makes -Dloader.path unnecessary for the common case: a "plugins-lib" folder next to
# wherever game-server.jar is run from is scanned for extra plugin jars automatically, with no
# CLI flag needed. A missing plugins-lib folder is fine - loader.path entries that don't exist on
# disk are silently skipped, so this is a no-op until a plugin jar is actually dropped there.
# Override with -Dloader.path=... or the LOADER_PATH env var to point elsewhere instead - both
# take precedence over this file. See PLUGIN_README.md.
loader.path=plugins-lib
